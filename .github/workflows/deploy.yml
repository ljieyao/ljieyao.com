name: Deploy to Cloudflare Pages

# Deploys the Next.js static export (./out) to the ljieyao-com Cloudflare Pages
# project (https://ljieyao-com.pages.dev).
#
# Required GitHub secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  - API token with "Cloudflare Pages: Edit" permission
#                           on the account. Create at
#                           https://dash.cloudflare.com/profile/api-tokens
#   CLOUDFLARE_ACCOUNT_ID - Account ID from the Cloudflare dashboard
#                           (Workers & Pages > Overview, right sidebar).
#
# Behavior:
#   - push to main      -> production deployment (ljieyao-com.pages.dev)
#   - pull_request      -> preview deployment (unique <hash>.ljieyao-com.pages.dev URL)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager" (pnpm@11.22.0) —
        # specifying both here errors with ERR_PNPM_BAD_PM_VERSION

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        # Public-facing NEXT_PUBLIC_* env vars are inlined into the static
        # export at build time. Define them here so each build produces a
        # self-contained ./out with the correct contact-form sitekey + worker URL.
        env:
          NEXT_PUBLIC_TURNSTILE_SITEKEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITEKEY }}
          NEXT_PUBLIC_CONTACT_WORKER_URL: ${{ vars.NEXT_PUBLIC_CONTACT_WORKER_URL }}
        run: pnpm build

      - name: Verify Cloudflare auth
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN is empty"; exit 1; fi
          RES=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "$RES" | grep -q '"success":true' || (echo "::error::Token verify failed: $RES"; exit 1)
          echo "Token valid"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          # wrangler-action v3 still declares Node 20; runner defaults to Node 24 — suppress deprecation noise
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./out --project-name=ljieyao-com
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
